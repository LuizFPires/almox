<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F2937" />
    <title>Sem conexão · Almox</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 20px;
        background: #f6f7f9;
        color: #1f2937;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #586474;
        font-size: 17px;
      }
      button {
        min-height: 56px;
        padding: 0 24px;
        border: 0;
        border-radius: 10px;
        background: #1f2937;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Sem conexão</h1>
    <p>Sem internet agora. A tela volta sozinha quando o sinal voltar.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
    <script>
      // Recarrega sozinho: a TV do almoxarifado não tem quem toque na tela.
      addEventListener('online', () => location.reload())
      setInterval(() => navigator.onLine && location.reload(), 30000)
    </script>
  </body>
</html>
