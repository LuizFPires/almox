<h2>Seu código do Almox</h2>
<p>Use este código no aplicativo para criar ou trocar a sua senha:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
<p>Ele vale 15 minutos e só funciona uma vez.</p>
<p>Não pediu? Ignore este e-mail: a sua senha continua a mesma.</p>
